<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>OrthoFlow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Manrope only. Cormorant Garamond was loaded on every page load and
       referenced by a `.serif` class that appeared nowhere in the product. -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <meta name="theme-color" content="#20414e">
  <meta name="color-scheme" content="light dark">
  <!-- Sets the theme before the first paint so a dark-mode user never sees a
       white flash. ThemeService owns it from there. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('orthoflow_theme');
        var dark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* storage blocked: stay light */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
