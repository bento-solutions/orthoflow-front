name: CodeQL

# Static analysis for XSS sinks, unsafe URL handling and similar flaws in the
# TypeScript (audit H5). Free for public repositories; findings appear under
# Security -> Code scanning.
on:
  pull_request:
    branches: [main, feature/denteam-parity]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
