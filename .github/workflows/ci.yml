name: Frontend CI

# Runs on every pull request, and as the first job of both deploy workflows
# (deploy.yml for main, deploy-parity.yml for feature/denteam-parity), which
# call it through workflow_call and deploy only if it passes (audit H5).
on:
  pull_request:
    branches: [main, feature/denteam-parity]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking: a known high-severity advisory in what ships to the browser
      # stops the build (it was advisory-only, and Angular sat on four).
      - name: Dependency vulnerability scan (shipped code)
        run: npm audit --omit=dev --audit-level=high

      # Advisory: build tooling never reaches the browser.
      - name: Dependency vulnerability scan (build tooling)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build (production configuration)
        run: npx ng build --configuration production

      - name: Build (parity configuration)
        run: npx ng build --configuration parity

      - name: Unit tests
        run: npx ng test --watch=false

      # Also runs `nginx -t` on the rendered config, CSP included.
      - name: Build image (no push) to catch Dockerfile and nginx regressions
        run: docker build -t orthoflow-frontend:ci .

  # Blocking on pull requests: a new dependency with a known high-severity
  # advisory is not merged. Needs the repository's dependency graph
  # (Settings -> Code security), on by default for public repositories.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
