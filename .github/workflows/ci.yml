name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production configuration)
        run: npx ng build --configuration production

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build image (no push) to catch Dockerfile regressions
        run: docker build -t orthoflow-frontend:ci .

  # Requires the repository "Dependency graph" feature to be enabled
  # (Settings -> Advanced Security -> Dependency graph). Without it the
  # action hard-fails with "Dependency review is not supported on this
  # repository". Kept advisory-only so an infra/setting regression never
  # blocks PRs; it does not gate deploy.yml.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
