name: Build and deploy orthoflow-frontend

# push to main → build the image, push it to GHCR, then SSH the VPS and run
# deploy.sh, which pulls that tag and recreates the front service.
# Mirrors the backend's deploy.yml pipeline.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-orthoflow-frontend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orthoflow-front

jobs:
  # Tests, both builds, the audit and the image build (ci.yml) pass before
  # anything is built for the VPS (audit H5).
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CONFIG=production
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The registry token goes over the ssh session's input, not its command
      # line, where any process listing on the VPS could read it.
      - name: Deploy frontend to the VPS
        env:
          GHCR_LOGIN_USER: ${{ github.actor }}
          GHCR_LOGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          printf 'export GHCR_LOGIN_USER=%q GHCR_LOGIN_TOKEN=%q\nexec /srv/bento/apps/ortho/deploy.sh front %q\n' \
            "$GHCR_LOGIN_USER" "$GHCR_LOGIN_TOKEN" "$TAG" \
            | ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 "${{ secrets.DEPLOY_SSH_HOST }}" 'bash -s'
