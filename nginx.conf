# OrthoFlow frontend — static Angular build served by nginx, behind the
# host's Traefik (TLS terminates there). See AUDIT-2026-09.md H5: this file
# previously set no security headers and no CSP at all, while the app stores
# its auth token in localStorage — any XSS or bad dependency could exfiltrate
# a clinical-system session.
#
# All headers are declared once, at server level. nginx drops every
# inherited add_header the moment a location block adds one of its own, so
# there are deliberately no add_header directives inside location {} below —
# the per-file Cache-Control is driven by the $cache_control map instead.

# Cache for good only what is named by its content; revalidate everything else.
# Every .js/.svg/.png used to be "immutable" for a year, including files with a
# fixed name (voice/pcm-capture-worklet.js, theme-init.js, the perio drawings):
# a browser kept the old one after a release (audit P5). The build names its
# output main-ABCD1234.js, chunk-ABCD1234.js, media/font-ABCD1234.woff2; the 3D
# models carry a hash too. Anything else is revalidated (a 304 when unchanged).
# The patterns are quoted because they contain braces, which nginx would
# otherwise read as the start of a block.
map $uri $cache_control {
    default                                                              "no-cache";
    "~-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|eot|png|jpe?g|svg|gif|webp)$"   "public, max-age=31536000, immutable";
    "~\.[0-9a-f]{10}\.glb$"                                              "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (every response) ──────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The camera is the app's own: the sterilisation screens scan instrument QR
    # codes with it (camera=() blocked them). Nothing else may ask for it.
    add_header Permissions-Policy "camera=(self), geolocation=(), payment=(), usb=(), microphone=(self)" always;
    # Traefik also terminates TLS and may set HSTS; a duplicate is harmless
    # and this keeps it correct even if the edge config drifts.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Content-Security-Policy, enforced (audit F1):
    #   script-src 'self'          no inline script anywhere: the theme bootstrap
    #                              is theme-init.js, and critical-CSS inlining
    #                              (which added onload="this.media='all'") is off
    #                              in angular.json.
    #              'wasm-unsafe-eval'  the 3D chart decompresses its model with
    #                              WebAssembly; without it the model cannot load.
    #   style-src  'unsafe-inline' Angular injects component styles as <style>,
    #                              and charts set style attributes.
    #   font-src   'self'          fonts are self-hosted (src/fonts.css).
    #   img-src    data: blob:     cabinet-logo data URLs and canvas exports.
    #   media-src  blob:           recorded audio played back in the browser.
    #   connect-src                this origin and the API the bundle calls.
    #                              __API_ORIGIN__ is filled in at image build
    #                              from the configuration's environment file
    #                              (tools/render-nginx-conf.mjs), so the two
    #                              cannot disagree.
    #   worker-src blob:           three.js / pdf workers.
    # Widen a specific directive if a new dependency needs another origin;
    # never drop the header.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' __API_ORIGIN__; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";
    add_header Content-Security-Policy $csp always;

    add_header Cache-Control $cache_control always;

    # ── Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json model/gltf-binary;
    gzip_min_length 1024;

    # The 3D chart's models. Named by their content, so cached for good. A model that is not
    # there is a 404, never the app shell, which the chart could only fail to parse.
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
