# OrthoFlow frontend — static Angular build served by nginx, behind the
# host's Traefik (TLS terminates there). See AUDIT-2026-09.md H5: this file
# previously set no security headers and no CSP at all, while the app stores
# its auth token in localStorage — any XSS or bad dependency could exfiltrate
# a clinical-system session.
#
# All headers are declared once, at server level. nginx drops every
# inherited add_header the moment a location block adds one of its own, so
# there are deliberately no add_header directives inside location {} below —
# the per-file Cache-Control is driven by the $cache_control map instead.

# Hard-cache hashed build assets; keep the app shell revalidating.
map $uri $cache_control {
    default                                            "no-cache";
    ~*\.(?:js|css|woff2?|png|jpe?g|svg|gif|ico|webp)$  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (every response) ──────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
    # Traefik also terminates TLS and may set HSTS; a duplicate is harmless
    # and this keeps it correct even if the edge config drifts.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Content-Security-Policy — as tight as the app's real dependencies allow:
    #   script-src 'self'          Angular's prod bundle has no inline/eval'd JS.
    #   style-src  'unsafe-inline' Angular injects component styles as <style>;
    #                              plus the Google Fonts stylesheet.
    #   font-src   fonts.gstatic   Manrope + Material Icons web fonts.
    #   img-src    data: blob:     cabinet-logo data URLs (localStorage) and
    #                              html2canvas / jsPDF canvas exports.
    #   connect-src apiortho…      the API origin the production build calls.
    #   worker-src blob:           three.js / pdf workers.
    # Widen a specific directive if a new dependency needs another origin —
    # do not drop the header.
    #
    # Shipped as Report-Only first (audit H5's own advice): it will not break
    # anything, and violations show in the browser console. Once the deployed
    # site has been clicked through with the console open and no CSP
    # violations appear, switch the header name to `Content-Security-Policy`
    # to enforce it. Keep the value identical between the two.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://apiortho.crmbento.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";
    add_header Content-Security-Policy-Report-Only $csp always;

    add_header Cache-Control $cache_control always;

    # ── Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
